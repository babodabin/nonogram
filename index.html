<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>그림 발굴 · Nonogram</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="그림 발굴">
<meta name="theme-color" content="#15140f">
<link rel="apple-touch-icon" href="nonogram-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="nonogram-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="nonogram-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15140f;
    --ink2:#211f18;
    --paper:#ece6d6;
    --paper2:#dcd4bf;
    --line:#aa9f82;
    --line2:#7d7257;
    --fill:#26221c;
    --accent:#cf5a2c;
    --gold:#cf9f3a;
    --dim:#736b58;
    --x:#9e9176;
    --paperTxt:#2a2419;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;overflow:hidden;background:var(--ink);}
  body{
    font-family:'Noto Sans KR',sans-serif; color:var(--paper);
    touch-action:none;
    display:flex;flex-direction:column;
    padding:max(env(safe-area-inset-top,0px),12px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Black Han Sans',sans-serif;font-weight:400;}

  /* ─────────── 화면 전환 ─────────── */
  .screen{display:none;flex-direction:column;height:100%;min-height:0;}
  .screen.show{display:flex;}

  /* ─────────── 스테이지 맵 ─────────── */
  #mapScreen{padding:8px 0;}
  .mapHead{padding:14px 20px 18px;}
  .mapHead .t{font-family:'Black Han Sans',sans-serif;font-size:30px;letter-spacing:.02em;line-height:1;}
  .mapHead .s{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.4em;
    color:var(--dim);text-transform:uppercase;margin-top:8px;}
  .stageList{flex:1;overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:16px;}
  .stage{
    background:var(--ink2);border:1px solid #34302440;border-radius:16px;padding:16px;
  }
  .stage.locked{opacity:.45;}
  .stageTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .stageTitle{display:flex;align-items:baseline;gap:10px;}
  .stageTitle .no{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-weight:700;}
  .stageTitle .nm{font-family:'Black Han Sans',sans-serif;font-size:22px;letter-spacing:.02em;}
  .stageTitle .en{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.3em;}
  .diff{font-size:11px;font-weight:900;padding:2px 9px;border-radius:20px;letter-spacing:.04em;}
  .df-easy{background:#3a4a2e;color:#bfe08a;}
  .df-hi{background:#4a3520;color:#e8a85a;}
  .df-max{background:#4a2020;color:#f08a6a;}
  .df-size{background:#2b281f;color:#b7ac8f;}
  .stageProg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);font-weight:600;}
  /* 큰 그림 = 4타일 미리보기 */
  .bigPic{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
  }
  .tile{
    aspect-ratio:1; background:var(--paper); border-radius:8px; position:relative;
    cursor:pointer; overflow:hidden; box-shadow:inset 0 0 0 1px #00000010;
    transition:transform .1s;
  }
  .tile:active{transform:scale(.97);}
  .tile canvas{width:100%;height:100%;display:block;}
  .tile .lock{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--paper2);color:var(--dim);font-family:'IBM Plex Mono';font-size:26px;font-weight:700;
  }
  .tile .badge{
    position:absolute;left:6px;top:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;
    background:rgba(0,0,0,.55);color:var(--paper);padding:2px 6px;border-radius:5px;letter-spacing:.05em;
  }
  .tile.done .badge{background:var(--gold);color:var(--ink);}

  /* ─────────── 게임 화면 ─────────── */
  #playScreen{}
  header{
    flex:0 0 auto; padding:4px 16px 8px;
    display:flex;align-items:center;gap:12px;
  }
  .backBtn{
    width:42px;height:42px;border-radius:11px;border:1px solid var(--line2);
    background:transparent;color:var(--paper);cursor:pointer;flex-shrink:0;
    font-size:20px;display:flex;align-items:center;justify-content:center;
  }
  .backBtn:active{background:rgba(236,230,214,.08);}
  .hTitle{flex:1;line-height:1.1;}
  .hTitle .nm{font-family:'Black Han Sans',sans-serif;font-size:19px;letter-spacing:.02em;}
  .hTitle .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);
    letter-spacing:.1em;margin-top:3px;}
  .hTitle .meta b{color:var(--accent);}

  #boardWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:6px 10px;min-height:0;overflow:hidden;}
  #board{background:var(--paper);border-radius:5px;transform-origin:0 0;
    box-shadow:0 12px 44px rgba(0,0,0,.55),0 2px 0 var(--paper2);padding:8px;}
  canvas{display:block;border-radius:2px;touch-action:none;}

  footer{flex:0 0 auto;padding:10px 16px 6px;display:flex;flex-direction:column;gap:11px;}
  .tools{display:flex;gap:10px;}
  .tool{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    padding:16px 10px;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--line2);background:rgba(236,230,214,.04);
    color:var(--paper);font-size:16px;font-weight:700;letter-spacing:.04em;transition:.12s;
  }
  .tool .gl{font-family:'IBM Plex Mono',monospace;font-size:20px;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0;}
  .tool.fillT .gl{background:var(--fill);color:var(--paper);}
  .tool.xT .gl{color:var(--x);}
  .tool.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(207,90,44,.42);}
  .tool.on .gl{background:rgba(255,255,255,.92);color:var(--accent);}
  .tool:active{transform:translateY(1px);}
  .subRow{display:flex;gap:10px;}
  .sbtn{flex:1;padding:12px;border-radius:10px;cursor:pointer;text-align:center;
    border:1px solid var(--line2);background:transparent;color:var(--dim);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;transition:.12s;}
  .sbtn:active{background:rgba(236,230,214,.08);color:var(--paper);}

  /* ─────────── 완성 오버레이 ─────────── */
  .clear{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(8,7,5,.92);backdrop-filter:blur(6px);
    padding:28px;text-align:center;}
  .clear.show{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .clear .revealed{background:var(--paper);padding:14px;border-radius:8px;margin-bottom:20px;
    box-shadow:0 14px 44px rgba(0,0,0,.55);}
  .clear .ttl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.45em;
    color:var(--gold);text-transform:uppercase;}
  .clear .nm{font-family:'Black Han Sans',sans-serif;font-size:34px;margin:6px 0 4px;letter-spacing:.03em;}
  .clear .sub{font-size:13px;color:var(--dim);margin-bottom:24px;font-weight:500;}
  .clear .cbtns{display:flex;gap:11px;}
  .clear .cbtn{padding:14px 22px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:700;
    border:1.5px solid var(--line2);background:transparent;color:var(--paper);letter-spacing:.03em;}
  .clear .cbtn.prime{background:var(--gold);border-color:var(--gold);color:var(--ink);}
  .clear .cbtn:active{transform:translateY(1px);}

  /* 스테이지 완성 특별 오버레이 */
  .stageClear{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(8,7,5,.95);backdrop-filter:blur(8px);
    padding:28px;text-align:center;}
  .stageClear.show{display:flex;animation:fade .4s ease;}
  .stageClear .bigReveal{display:grid;grid-template-columns:1fr 1fr;gap:5px;
    background:var(--paper);padding:10px;border-radius:10px;margin-bottom:22px;
    box-shadow:0 16px 50px rgba(0,0,0,.6);}
  .stageClear .bigReveal canvas{width:78px;height:78px;border-radius:4px;display:block;}
  .stageClear .ttl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.5em;
    color:var(--gold);text-transform:uppercase;}
  .stageClear .nm{font-family:'Black Han Sans',sans-serif;font-size:30px;margin:6px 0 4px;}
  .stageClear .sub{font-size:13px;color:var(--dim);margin-bottom:24px;font-weight:500;}
</style>
</head>
<body>

<!-- ═══════════ 스테이지 맵 ═══════════ -->
<div class="screen show" id="mapScreen">
  <div class="mapHead">
    <div class="t">그림 발굴</div>
    <div class="s">Nonogram · 15/20/25 · 입문→최상</div>
  </div>
  <div class="stageList" id="stageList"></div>
</div>

<!-- ═══════════ 게임 ═══════════ -->
<div class="screen" id="playScreen">
  <header>
    <button class="backBtn" id="backBtn">‹</button>
    <div class="hTitle">
      <div class="nm" id="pNm">—</div>
      <div class="meta"><span id="pStage">—</span> · <b id="pProg">0/225</b></div>
    </div>
  </header>
  <div id="boardWrap"><div id="board"><canvas id="cv"></canvas></div></div>
  <footer>
    <div class="tools">
      <div class="tool fillT on" id="fillTool"><span class="gl">■</span>칠하기</div>
      <div class="tool xT" id="xTool"><span class="gl">✕</span>제외</div>
    </div>
    <div class="subRow">
      <button class="sbtn" id="undoBtn">↶ 되돌리기</button>
      <button class="sbtn" id="resetBtn">↺ 처음부터</button>
    </div>
  </footer>
</div>

<!-- 퍼즐 완성 -->
<div class="clear" id="clearScreen">
  <div class="revealed"><canvas id="revealCv"></canvas></div>
  <div class="ttl">Excavated</div>
  <div class="nm" id="clearName">—</div>
  <div class="sub" id="clearSub">조각을 발굴했어요</div>
  <div class="cbtns">
    <button class="cbtn" id="clearMap">스테이지로</button>
    <button class="cbtn prime" id="clearNext">다음 조각 →</button>
  </div>
</div>

<!-- 스테이지 완성 -->
<div class="stageClear" id="stageClearScreen">
  <div class="bigReveal" id="bigReveal"></div>
  <div class="ttl">Stage Complete</div>
  <div class="nm" id="stageClearName">—</div>
  <div class="sub">큰 그림을 완성했어요</div>
  <div class="cbtns" style="display:flex;gap:11px;">
    <button class="cbtn prime" id="stageClearOk" style="padding:14px 22px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:700;border:1.5px solid var(--gold);background:var(--gold);color:var(--ink);">다음 스테이지 →</button>
  </div>
</div>

    for(let c=0;c<N;c++){ const h=colHints[c],x=PADL+c*CS+CS/2;
      for(let k=0;k<h.length;k++){ const cy=PADT-(h.length-1-k)*CS-CS*0.5;
        ctx.textAlign='center'; ctx.fillStyle='#33301f'; ctx.fillText(h[k],x,cy+1); } }
    let f=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(cell[r][c]===1)f++;
    $('pProg').textContent=f+'/'+(N*N);
  }

  // ── 입력 (축 잠금 + 드래그는 한 종류만, 빈 칸에만) ──
  let dragging=false,dragMode=null,startRC=null,axis=null,lastKey=null,moved=false,tapVal=null;
  function cellAt(px,py){
    const rect=cv.getBoundingClientRect();
    const sc=rect.width/(PADL+N*CS);
    const x=(px-rect.left)/sc-PADL, y=(py-rect.top)/sc-PADT;
    let c=Math.floor(x/CS), r=Math.floor(y/CS);
    if(r<0&&y> -CS*0.4) r=0; if(r>=N&&y<(N*CS)+CS*0.4) r=N-1;
    if(c<0&&x> -CS*0.4) c=0; if(c>=N&&x<(N*CS)+CS*0.4) c=N-1;
    if(r<0||r>=N||c<0||c>=N) return null;
    return {r,c};
  }
  // 드래그 중: 시작 칸 상태로 칠하기/지우기 결정. dragErase=true면 지움.
  let dragErase=false;
  function paintCell(r,c){
    const want = (dragMode==='fill') ? 1 : 2;
    if(dragErase){
      // 지우기: 같은 종류로 칠해진 칸만 지움
      if(cell[r][c]===want){ cell[r][c]=0; draw(); }
    } else {
      // 칠하기: 빈 칸만
      if(cell[r][c]===0){ cell[r][c]=want; draw(); }
    }
  }
  function pushHist(){ history.push(cell.map(r=>r.slice())); if(history.length>80)history.shift(); }
  function onDown(e){
    e.preventDefault();
    if(e.touches&&e.touches.length>=2){ startPinch(e); return; }
    const t=e.touches?e.touches[0]:e;
    const p=cellAt(t.clientX,t.clientY); if(!p)return;
    pushHist();
    dragging=true;dragMode=mode;startRC=p;axis=null;moved=false;
    const want=(mode==='fill')?1:2;
    // 시작 칸이 이미 같은 종류로 칠해져 있으면 → 이 드래그는 '지우기'
    dragErase = (cell[p.r][p.c]===want);
    tapVal = (cell[p.r][p.c]===want) ? 0 : want;
    lastKey=p.r+','+p.c;
  }
  function onMove(e){
    if(pinch&&e.touches&&e.touches.length>=2){ e.preventDefault(); movePinch(e); return; }
    if(!dragging)return; e.preventDefault();
    const t=e.touches?e.touches[0]:e;
    const p=cellAt(t.clientX,t.clientY); if(!p)return;
    if(axis===null){
      const dr=Math.abs(p.r-startRC.r), dc=Math.abs(p.c-startRC.c);
      if(dr>0||dc>0){ axis=(dc>=dr)?'h':'v'; moved=true;
        paintCell(startRC.r,startRC.c);
      }
    }
    if(!moved) return;
    let r=p.r,c=p.c;
    if(axis==='h') r=startRC.r; else if(axis==='v') c=startRC.c;
    const key=r+','+c;
    if(key!==lastKey){ paintCell(r,c); lastKey=key; }
  }
  function onUp(e){
    if(pinch){ if(!e||!e.touches||e.touches.length<2) pinch=null; return; }
    if(!dragging)return;
    // 안 움직였으면(탭) → 토글 적용
    if(!moved && startRC){
      cell[startRC.r][startRC.c]=tapVal;
      draw();
    }
    dragging=false; saveProgress(); checkWin();
  }

  // ── 핀치 줌/이동 (두 손가락) ──
  let pinch=null,vScale=1,vTx=0,vTy=0;
  const boardEl=$('board');
  function applyView(){ boardEl.style.transform=`translate(${vTx}px,${vTy}px) scale(${vScale})`; }
  function resetView(){ vScale=1;vTx=0;vTy=0; applyView(); }
  function startPinch(e){
    dragging=false; moved=true;
    const a=e.touches[0],b=e.touches[1];
    const rect=boardEl.getBoundingClientRect();
    pinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1, s0:vScale,
      px:((a.clientX+b.clientX)/2-rect.left)/vScale, py:((a.clientY+b.clientY)/2-rect.top)/vScale,
      layX:rect.left-vTx, layY:rect.top-vTy};
  }
  function movePinch(e){
    const a=e.touches[0],b=e.touches[1];
    let s=pinch.s0*(Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d0);
    s=Math.min(3.5,Math.max(1,s));
    const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
    vScale=s; vTx=mx-pinch.layX-s*pinch.px; vTy=my-pinch.layY-s*pinch.py;
    if(s<=1.01){vTx=0;vTy=0;}
    const w=boardEl.offsetWidth,h=boardEl.offsetHeight;
    const ww=$('boardWrap').clientWidth,wh=$('boardWrap').clientHeight;
    vTx=Math.max(-(w*s-60),Math.min(ww,vTx));
    vTy=Math.max(-(h*s-60),Math.min(wh,vTy));
    applyView();
  }
  cv.addEventListener('touchstart',onDown,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  cv.addEventListener('touchend',onUp);
  cv.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);

  // ── 저장: 자동 ──
  function saveProgress(){
    const all=loadAllProg();
    all[curName]={cell};
    saveAllProg(all);
  }

  // ── 승리 ──
  function checkWin(){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if((sol[r][c]===1)!==(cell[r][c]===1)) return;
    }
    onWin();
  }
  function onWin(){
    const d=loadDone(); d[curName]=true; saveDone(d);
    for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(cell[r][c]===2) cell[r][c]=0;
    draw();
    const all=loadAllProg(); delete all[curName]; saveAllProg(all);
    // 스테이지 완성 여부
    const stage=STAGES[curStageIdx];
    const allDone=stage.tiles.every(t=>d[t]);
    if(allDone){ showStageClear(stage); }
    else { showPieceClear(); }
  }
  function drawMini(canvas,name,size){
    const g=PUZZLES[name]; const n=g.length; const dpr=Math.min(window.devicePixelRatio||1,2);
    const s=size/n;
    canvas.width=size*dpr;canvas.height=size*dpr;canvas.style.width=size+'px';canvas.style.height=size+'px';
    const x=canvas.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
    x.fillStyle='#ece6d6';x.fillRect(0,0,size,size);
    x.fillStyle='#26221c';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(g[r][c]) x.fillRect(c*s,r*s,Math.ceil(s),Math.ceil(s));
  }
  function showPieceClear(){
    drawMini($('revealCv'),curName,168);
    $('clearName').textContent=curName;
    const stage=STAGES[curStageIdx];
    const done=loadDone();
    const cnt=stage.tiles.filter(t=>done[t]).length;
    $('clearSub').textContent=`${stage.id} 스테이지 · ${cnt}/${stage.tiles.length} 조각`;
    $('clearScreen').classList.add('show');
  }
  function showStageClear(stage){
    const wrap=$('bigReveal'); wrap.innerHTML='';
    const total=stage.tiles.length;
    const cols = total<=4 ? 2 : 5;
    wrap.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    const sz = total<=4 ? 78 : 52;
    stage.tiles.forEach(t=>{ const cvn=document.createElement('canvas'); wrap.appendChild(cvn); drawMini(cvn,t,sz); });
    $('stageClearName').textContent=stage.id;
    $('stageClearScreen').classList.add('show');
  }

  // ── 퍼즐 로드 ──
  function openPuzzle(name, stageIdx){
    curName=name; curStageIdx=stageIdx;
    sol=PUZZLES[name]; N=sol.length; buildHints();
    const all=loadAllProg();
    if(all[name]&&all[name].cell&&all[name].cell.length===N){ cell=all[name].cell; }
    else { cell=Array.from({length:N},()=>Array(N).fill(0)); }
    history=[];
    $('pNm').textContent=name;
    $('pStage').textContent=STAGES[stageIdx].id+' · '+N+'×'+N;
    showScreen('play'); resetView();
    requestAnimationFrame(()=>{ layout(); draw(); });
  }

  // ── 스테이지 맵 ──
  function renderMap(){
    const done=loadDone();
    const wrap=$('stageList'); wrap.innerHTML='';
    STAGES.forEach((stage,si)=>{
      const prevDone = true;  // 모든 스테이지 잠금 해제
      const cnt=stage.tiles.filter(t=>done[t]).length;
      const total=stage.tiles.length;
      const el=document.createElement('div');
      el.className='stage'+(prevDone?'':' locked');
      const diffClass = stage.diff==='최상'?'df-max':(stage.diff==='상'?'df-hi':'df-easy');
      el.innerHTML=`
        <div class="stageTop">
          <div class="stageTitle">
            <span class="no">${String(si+1).padStart(2,'0')}</span>
            <span class="nm">${stage.id}</span>
            ${stage.diff?`<span class="diff ${diffClass}">${stage.diff}</span>`:''}
            <span class="diff df-size">${stage.grid}×${stage.grid}</span>
          </div>
          <span class="stageProg">${cnt}/${total}</span>
        </div>
        <div class="bigPic"></div>`;
      const pic=el.querySelector('.bigPic');
      // 타일 수에 맞춰 열 수 결정: 4개→2열, 10개→5열
      const cols = total<=4 ? 2 : 5;
      pic.style.gridTemplateColumns=`repeat(${cols},1fr)`;
      stage.tiles.forEach((t,ti)=>{
        const tile=document.createElement('div');
        const isDone=done[t];
        tile.className='tile'+(isDone?' done':'');
        tile.innerHTML=`<span class="badge">${String(ti+1).padStart(2,'0')}</span>`;
        if(isDone){
          const c=document.createElement('canvas'); tile.appendChild(c);
          requestAnimationFrame(()=>{drawMini(c,t,200);c.style.width='100%';c.style.height='100%';});
        } else if(prevDone){
          tile.innerHTML+=`<div class="lock" style="background:var(--paper);color:var(--line)">＋</div>`;
        } else {
          tile.innerHTML+=`<div class="lock">🔒</div>`;
        }
        if(prevDone){ tile.addEventListener('click',()=>openPuzzle(t,si)); }
        pic.appendChild(tile);
      });
      wrap.appendChild(el);
    });
  }

  function showScreen(which){
    $('mapScreen').classList.toggle('show', which==='map');
    $('playScreen').classList.toggle('show', which==='play');
    if(which==='map') renderMap();
  }

  // ── 버튼 ──
  $('fillTool').addEventListener('click',()=>{ mode='fill';$('fillTool').classList.add('on');$('xTool').classList.remove('on'); });
  $('xTool').addEventListener('click',()=>{ mode='x';$('xTool').classList.add('on');$('fillTool').classList.remove('on'); });
  $('backBtn').addEventListener('click',()=>{ saveProgress(); showScreen('map'); });
  $('undoBtn').addEventListener('click',()=>{ if(history.length){ cell=history.pop(); draw(); saveProgress(); } });
  $('resetBtn').addEventListener('click',()=>{ pushHist(); cell=Array.from({length:N},()=>Array(N).fill(0)); draw(); saveProgress(); });
  $('clearMap').addEventListener('click',()=>{ $('clearScreen').classList.remove('show'); showScreen('map'); });
  $('clearNext').addEventListener('click',()=>{
    $('clearScreen').classList.remove('show');
    const stage=STAGES[curStageIdx]; const done=loadDone();
    const next=stage.tiles.find(t=>!done[t]);
    if(next) openPuzzle(next,curStageIdx);
    else showScreen('map');
  });
  $('stageClearOk').addEventListener('click',()=>{
    $('stageClearScreen').classList.remove('show');
    const ni=curStageIdx+1;
    if(ni<STAGES.length){
      const done=loadDone(); const next=STAGES[ni].tiles.find(t=>!done[t]);
      if(next){ openPuzzle(next,ni); return; }
    }
    showScreen('map');
  });

  window.addEventListener('resize',()=>{ if($('playScreen').classList.contains('show')&&sol){ resetView(); layout(); draw(); } });

  // ── 시작 ──
  showScreen('map');
</script>
</body>
</html>
